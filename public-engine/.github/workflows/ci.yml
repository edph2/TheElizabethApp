name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Voice file format tests
        run: ./gradlew --no-daemon :voiceformat:test

      - name: Build
        run: ./gradlew --no-daemon :engine:assembleDebug :engine:assembleRelease

      - name: Lint
        run: ./gradlew --no-daemon :engine:lintDebug

      - name: Software bill of materials
        run: ./gradlew --no-daemon cyclonedxBom

      - name: Check the engine has no network permissions
        run: |
          tools/check_no_network.sh engine/build/outputs/apk/debug/engine-debug.apk
          tools/check_no_network.sh engine/build/outputs/apk/release/engine-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: engine-debug-apk
          path: engine/build/outputs/apk/debug/engine-debug.apk

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/reports/bom.*

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            voiceformat/build/reports
            engine/build/reports

  device-tests:
    # The engine on an Android emulator: no network access, voice import, and real speech with a
    # published Piper voice, directly and through Android's TextToSpeech API.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Package a published voice for the speech tests
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_VOICE_PASSPHRASE: correct horse battery
        run: |
          pip install -r tools/voice-training/requirements.txt
          gh release download tts-models -R k2-fsa/sherpa-onnx -p 'vits-piper-en_GB-alba-medium.tar.bz2'
          tar xjf vits-piper-en_GB-alba-medium.tar.bz2
          mkdir -p engine/src/androidTest/assets
          python3 tools/voice-training/package_voice.py --sherpa-dir vits-piper-en_GB-alba-medium \
            --licence "test only (see MODEL_CARD)" --passphrase-env TEST_VOICE_PASSPHRASE \
            --out engine/src/androidTest/assets/test.elizvoice

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :engine:connectedDebugAndroidTest

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: engine/build/reports/androidTests
