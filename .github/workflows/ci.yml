name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew --no-daemon :core:test

      - name: Build app
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Check the app has no network permissions
        run: |
          tools/check_no_network.sh app/build/outputs/apk/debug/app-debug.apk
          tools/check_no_network.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: elizabeth-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports
            app/build/reports
