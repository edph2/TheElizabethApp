name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (training tools)
        run: |
          pip install -r tools/voice-training/requirements.txt
          python3 -m unittest discover tools/voice-training -v

      - name: Unit tests (core)
        run: ./gradlew --no-daemon :voiceformat:test :core:test

      - name: Build app
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :engine:assembleDebug :engine:assembleRelease

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug :engine:lintDebug

      - name: Software bill of materials
        run: ./gradlew --no-daemon cyclonedxBom

      - name: Check neither app has network permissions
        run: |
          tools/check_no_network.sh app/build/outputs/apk/debug/app-debug.apk
          tools/check_no_network.sh app/build/outputs/apk/release/app-release-unsigned.apk
          tools/check_no_network.sh engine/build/outputs/apk/debug/engine-debug.apk
          tools/check_no_network.sh engine/build/outputs/apk/release/engine-release-unsigned.apk

      - name: Check the app contains no GPL speech-engine code
        run: |
          tools/check_no_gpl.sh app/build/outputs/apk/debug/app-debug.apk
          tools/check_no_gpl.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: elizabeth-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            engine/build/outputs/apk/debug/engine-debug.apk

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/reports/bom.*

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports
            app/build/reports

  device-tests:
    # Runs the instrumented tests on an Android emulator: Keystore encryption, the
    # no-network guarantee, export/restore, the main screen, and real on-device speech
    # with a published Piper voice packaged by tools/voice-training/package_voice.py.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Package a published voice for the end-to-end speech test
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_VOICE_PASSPHRASE: correct horse battery
        run: |
          pip install -r tools/voice-training/requirements.txt
          gh release download tts-models -R k2-fsa/sherpa-onnx -p 'vits-piper-en_GB-alba-medium.tar.bz2'
          tar xjf vits-piper-en_GB-alba-medium.tar.bz2
          mkdir -p app/src/androidTest/assets engine/src/androidTest/assets
          python3 tools/voice-training/package_voice.py --sherpa-dir vits-piper-en_GB-alba-medium \
            --licence "test only (see MODEL_CARD)" --passphrase-env TEST_VOICE_PASSPHRASE \
            --out engine/src/androidTest/assets/test.elizvoice
          cp engine/src/androidTest/assets/test.elizvoice app/src/androidTest/assets/test.elizvoice

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # The engine's own tests, then the app's tests with the engine installed (as on a real tablet).
          script: |
            ./gradlew --no-daemon :engine:connectedDebugAndroidTest
            ./gradlew --no-daemon :engine:installDebug :app:connectedDebugAndroidTest

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests
            engine/build/reports/androidTests
