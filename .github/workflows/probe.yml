# Temporary: inspects the sherpa-onnx release so the app can pin exact files and hashes.
name: Probe sherpa-onnx
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.13.8 -R k2-fsa/sherpa-onnx -p 'sherpa-onnx-1.13.8.aar'
          sha256sum sherpa-onnx-1.13.8.aar; ls -la sherpa-onnx-1.13.8.aar
          unzip -l sherpa-onnx-1.13.8.aar
          unzip -p sherpa-onnx-1.13.8.aar AndroidManifest.xml; echo
          unzip -p sherpa-onnx-1.13.8.aar META-INF/com/android/build/gradle/aar-metadata.properties; echo
          curl -sSLI https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar | grep -iE '^(HTTP|location)' | head -5
      - name: Piper voice archive layout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download tts-models -R k2-fsa/sherpa-onnx -p 'vits-piper-en_GB-alba-medium.tar.bz2'
          tar tjf vits-piper-en_GB-alba-medium.tar.bz2 | grep -v espeak-ng-data/ ; tar tjf vits-piper-en_GB-alba-medium.tar.bz2 | grep espeak-ng-data/ | grep -vE '_dict$' | head -60
          tar xjf vits-piper-en_GB-alba-medium.tar.bz2
          head -5 vits-piper-en_GB-alba-medium/tokens.txt; wc -l vits-piper-en_GB-alba-medium/tokens.txt
          pip install -q onnx
          python3 -c "import onnx; m=onnx.load('vits-piper-en_GB-alba-medium/en_GB-alba-medium.onnx'); print({p.key: p.value for p in m.metadata_props})"
          ls vits-piper-en_GB-alba-medium; cat vits-piper-en_GB-alba-medium/*.json 2>/dev/null | head -c 600 || true
          find vits-piper-en_GB-alba-medium/espeak-ng-data -name '*[^A-Za-z0-9._/-]*' | head
          du -sh vits-piper-en_GB-alba-medium/espeak-ng-data
