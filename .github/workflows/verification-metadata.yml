# Temporary: records the SHA-256 of every dependency the build uses (including the device
# tests), so Gradle can refuse any dependency that later changes. Output is printed to the log.
name: Generate dependency verification metadata
on:
  push:
    paths: ['.github/workflows/verification-metadata.yml']
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build everything while recording checksums
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon --write-verification-metadata sha256 :core:test :app:assembleDebug :app:assembleRelease :app:lintDebug cyclonedxBom :app:connectedDebugAndroidTest
      - name: Print metadata
        run: |
          wc -l gradle/verification-metadata.xml
          sha256sum gradle/verification-metadata.xml
          echo "-----BEGIN METADATA-----"
          gzip -9 -c gradle/verification-metadata.xml | base64 -w 120
          echo "-----END METADATA-----"
